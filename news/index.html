  /* ════════════════════════════════════════════════
     소식 — 2026-09-13 신설 · 나무🌳

     🔴 이 페이지의 규칙 — 세부를 적지 않습니다.
        정확히는 「다른 페이지에 이미 있는 세부는 적지 않고,
        소식에만 있는 사실은 적는다」입니다.
        날짜·가격·장소·시간·신청 방법은 클래스 목록과 각 안내판이
        이미 가지고 있습니다. 여기에까지 적으면 같은 사실이 네 곳에
        적히고, 하나를 고칠 때 넷을 고쳐야 합니다.
        소식은 「변화」를 알리고, 안내판이 「상태」를 갖습니다.

     한 건의 형태는 둘입니다.
       ① 링크형 — 날짜 + 한 줄 + 안내판 링크  (<a class="row-item">)
       ② 인사형 — 날짜 + 한 줄 (+ 소식에만 있는 사실 한 줄). 링크 없음
                  (<div class="row-item note">)

     골격은 base.css 의 .rowlist / .row-item 을 그대로 씁니다.
     .row-item .t 는 19.2px 로 「한 주의 새벽」 목록의 행(24px)보다
     한 단 아래입니다 — 소식은 더 가벼운 자리이기 때문입니다.
     ════════════════════════════════════════════════ */

  /* 날짜 칩 — base.css 의 .stamp 는 3.6rem 고정 폭 terra 글자입니다.
     여기서는 연도까지 적으므로 폭을 풀고 살구 칩으로 둡니다(살구 위 ink 13.19).
     이 페이지에 살구가 남는 유일한 자리입니다 — 면적은 1%가 안 되지만
     「살구가 0%가 되면 포근나루가 아니다」를 지키는 자리입니다. */
  .row-item .stamp{
    width:auto;
    color:var(--ink);
    background:var(--apricot);
    border-radius:var(--r-s);
    padding:.2rem .6rem;
  }

  /* 인사형 — 갈 안내판이 없는 건입니다.
     링크가 아니므로 호버 면(「눌리는 자리」 신호)을 걷습니다.
     대신 글자·칩·괘선은 링크형과 한 값도 다르게 두지 않습니다 —
     흐리게 하면 그 순간 「사소한 것」이 됩니다. */
  .row-item.note{cursor:default;}
  .row-item.note:hover{background:transparent;}

  @media (max-width:560px){
    .row-item{flex-wrap:wrap;gap:.55rem;}
  }
</style>
